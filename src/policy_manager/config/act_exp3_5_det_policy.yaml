# 与 exp3_5 config.json 对齐（8 维 joint state/action + cam1/cam3/cam4 RGB+Depth + environment_state），
# RT-DETRv4 检测与 act_exp3_0_det 一致；机械臂下发 joint_position（control_mode=0）。
policy_manager:
  ros__parameters:
    policy_type: act_exp3_5_det
    act_exp3_5_det_control_hz: 2.0

    # ACT checkpoint（lerobot pretrained_model 目录，见 exp3_5/config.json）
    act_exp3_5_det_checkpoint_dir: "/home/jhr/lerobot_act_train/exp3/exp3_5/checkpoints/last/pretrained_model"
    act_exp3_5_det_device: auto

    act_exp3_5_det_image_keys:
      - observation.images.cam1_color
      - observation.images.cam3_color
      - observation.images.cam4_color
    act_exp3_5_det_depth_keys:
      - observation.cam1_depth
      - observation.cam3_depth
      - observation.cam4_depth
    act_exp3_5_det_camera_ids: [cam1, cam3, cam4]
    act_exp3_5_det_depth_camera_ids: [cam1, cam3, cam4]
    act_exp3_5_det_use_depth: true

    act_exp3_5_det_state_key: observation.state
    act_exp3_5_det_img_h: 480
    act_exp3_5_det_img_w: 640
    act_exp3_5_det_depth_clip_mm_min: 100.0
    act_exp3_5_det_depth_clip_mm_max: 8000.0
    act_exp3_5_det_state_dim: 8
    act_exp3_5_det_action_dim: 8

    arm_reference_frame: fr3_link0
    arm_duration_sec: 0.2
    hand_duration_sec: 0.1
    act_exp3_5_det_hand_finger_id_order: [0, 1, 2, 3, 4, 5]
    act_exp3_5_det_hand_binary_threshold: 0.5
    act_exp3_5_det_hand_binary_reset_hardware: [1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 0.0]
    act_exp3_5_det_hand_binary_grasp_hardware: [500.0, 500.0, 500.0, 500.0, 500.0, 0.0]

    # ---- RT-DETRv4 + depth 位姿估计（与 act_exp3_0_det 相同）----
    act_exp3_5_det_detector_enabled: true
    act_exp3_5_det_detector_repo_root: /home/jhr/models/rtv4
    act_exp3_5_det_detector_config_path: /home/jhr/models/rtv4/configs/rtv4/rtv4_hgnetv2_s_conveyor_simple_sz_2.yml
    act_exp3_5_det_detector_checkpoint_path: /home/jhr/models/rtv4/rtv4_ckpt/checkpoint0038.pth
    act_exp3_5_det_detector_device: auto

    act_exp3_5_det_detector_camera_id: cam3
    act_exp3_5_det_detector_depth_camera_id: cam3
    act_exp3_5_det_detector_calib_path: /home/jhr/calibration/cam3_4-22.calib
    act_exp3_5_det_detector_calib_direction: base_from_camera

    act_exp3_5_det_detector_use_camera_info_intrinsics: true
    act_exp3_5_det_detector_fx: 615.0
    act_exp3_5_det_detector_fy: 615.0
    act_exp3_5_det_detector_cx: 320.0
    act_exp3_5_det_detector_cy: 240.0

    act_exp3_5_det_detector_score_thr: 0.35
    act_exp3_5_det_detector_min_area_ratio: 0.002
    act_exp3_5_det_detector_max_area_ratio: 0.9
    act_exp3_5_det_detector_depth_clip_mm_min: 100.0
    act_exp3_5_det_detector_depth_clip_mm_max: 8000.0

    act_exp3_5_det_environment_state_key: observation.environment_state
    act_exp3_5_det_environment_state_dim: 2
    act_exp3_5_det_env_state_use_detected_xy: true
    act_exp3_5_det_env_state_fallback_to_ee_xy: true
    act_exp3_5_det_env_state_latch_once: true
    act_exp3_5_det_env_state_require_initial_detection: true

    # joint state 应保持 7 关节 + hand_binary；勿将检测 xy 写入关节维
    act_exp3_5_det_state_use_detected_xy: false
    act_exp3_5_det_detector_strict_on_failure: false

    act_exp3_5_det_scale_closure_enabled: false
    act_exp3_5_det_scale_small_threshold_m: 0.25
    act_exp3_5_det_scale_large_threshold_m: 0.35
    act_exp3_5_det_scale_score_mode: sqrt
    act_exp3_5_det_scale_test_log: true

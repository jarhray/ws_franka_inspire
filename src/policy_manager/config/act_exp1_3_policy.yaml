# 与 data_recorded/exp1_3/meta/info.json 对齐：state/action 为 8（ee_pose + hand_grasp_binary），RGB+深度
policy_manager:
  ros__parameters:
    policy_type: act_exp1_3
    act_exp1_3_control_hz: 10.0

    act_exp1_3_checkpoint_dir: "/home/jhr/lerobot_act_train/exp1/result_3/checkpoints/last/pretrained_model"
    act_exp1_3_device: auto
    act_exp1_3_camera_id: cam1
    act_exp1_3_depth_camera_id: cam1
    act_exp1_3_image_key: observation.images.rs_color
    act_exp1_3_depth_key: observation.rs_depth
    act_exp1_3_use_depth: true
    act_exp1_3_state_key: observation.state
    act_exp1_3_img_h: 480
    act_exp1_3_img_w: 640
    # 与 rosbag2lerobot.py depth_clip_mm 对齐
    act_exp1_3_depth_clip_mm_min: 100.0
    act_exp1_3_depth_clip_mm_max: 8000.0
    act_exp1_3_state_dim: 8
    act_exp1_3_action_dim: 8

    arm_reference_frame: fr3_link0
    arm_duration_sec: 0.1
    hand_duration_sec: 0.1
    act_exp1_3_hand_finger_id_order: [0, 1, 2, 3, 4, 5]
    act_exp1_3_hand_binary_threshold: 0.5
    act_exp1_3_hand_binary_reset_hardware: [1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 0.0]
    act_exp1_3_hand_binary_grasp_hardware: [500.0, 500.0, 500.0, 500.0, 500.0, 0.0]

# 与 exp3_4 保持一致（8 维 state/action + cam1/cam3/cam4 RGB+Depth + environment_state），
# 在 state 构建阶段增加 RT-DETRv4 + 深度 + 手眼标定估计目标位置步骤。
policy_manager:
  ros__parameters:
    policy_type: act_exp3_0_det
    act_exp3_0_det_control_hz: 10.0

    # ACT checkpoint（lerobot pretrained_model 目录）
    act_exp3_0_det_checkpoint_dir: "/home/jhr/lerobot_act_train/exp3/exp3_4/checkpoints/last/pretrained_model"
    act_exp3_0_det_device: auto

    act_exp3_0_det_image_keys:
      - observation.images.cam1_color
      - observation.images.cam3_color
      - observation.images.cam4_color
    act_exp3_0_det_depth_keys:
      - observation.cam1_depth
      - observation.cam3_depth
      - observation.cam4_depth
    act_exp3_0_det_camera_ids: [cam1, cam3, cam4]
    act_exp3_0_det_depth_camera_ids: [cam1, cam3, cam4]
    act_exp3_0_det_use_depth: true

    act_exp3_0_det_state_key: observation.state
    act_exp3_0_det_img_h: 480
    act_exp3_0_det_img_w: 640
    act_exp3_0_det_depth_clip_mm_min: 100.0
    act_exp3_0_det_depth_clip_mm_max: 8000.0
    act_exp3_0_det_state_dim: 8
    act_exp3_0_det_action_dim: 8

    arm_reference_frame: fr3_link0
    arm_duration_sec: 0.2
    hand_duration_sec: 0.1
    act_exp3_0_det_hand_finger_id_order: [0, 1, 2, 3, 4, 5]
    act_exp3_0_det_hand_binary_threshold: 0.5
    act_exp3_0_det_hand_binary_reset_hardware: [1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 0.0]
    act_exp3_0_det_hand_binary_grasp_hardware: [500.0, 500.0, 500.0, 500.0, 500.0, 0.0]

    # ---- RT-DETRv4 + depth 位姿估计 ----
    act_exp3_0_det_detector_enabled: true
    act_exp3_0_det_detector_repo_root: /home/jhr/models/rtv4
    act_exp3_0_det_detector_config_path: /home/jhr/models/rtv4/configs/rtv4/rtv4_hgnetv2_s_conveyor_simple_sz_2.yml
    act_exp3_0_det_detector_checkpoint_path: /home/jhr/models/rtv4/rtv4_ckpt/checkpoint0038.pth
    act_exp3_0_det_detector_device: auto

    # 使用哪路相机做检测+深度估计（通常与手眼标定文件匹配）
    act_exp3_0_det_detector_camera_id: cam3
    act_exp3_0_det_detector_depth_camera_id: cam3
    act_exp3_0_det_detector_calib_path: /home/jhr/calibration/cam3_4-22.calib
    act_exp3_0_det_detector_calib_direction: base_from_camera

    # 优先使用 RobotObservation.camera_info 内参；取不到时回落到下面默认值
    act_exp3_0_det_detector_use_camera_info_intrinsics: true
    act_exp3_0_det_detector_fx: 615.0
    act_exp3_0_det_detector_fy: 615.0
    act_exp3_0_det_detector_cx: 320.0
    act_exp3_0_det_detector_cy: 240.0

    act_exp3_0_det_detector_score_thr: 0.35
    act_exp3_0_det_detector_min_area_ratio: 0.002
    act_exp3_0_det_detector_max_area_ratio: 0.9
    act_exp3_0_det_detector_depth_clip_mm_min: 100.0
    act_exp3_0_det_detector_depth_clip_mm_max: 8000.0

    # exp3_4 新增输入键（见 info.json）:
    # observation.environment_state = [init_object_base_x_m, init_object_base_y_m]
    act_exp3_0_det_environment_state_key: observation.environment_state
    act_exp3_0_det_environment_state_dim: 2
    act_exp3_0_det_env_state_use_detected_xy: true
    # 检测失败时，environment_state 回退为 ee_pose.x/ee_pose.y（或设 false 则回退为 0）
    act_exp3_0_det_env_state_fallback_to_ee_xy: true
    # true: 本次运行只在首次成功检测时写入一次 environment_state，后续保持不变
    act_exp3_0_det_env_state_latch_once: true
    # true: 首次成功检测前不进入 ACT 推理（满足“先检测再推理”）
    act_exp3_0_det_env_state_require_initial_detection: true

    # 通常建议 false，保持 observation.state 语义仍是 ee_pose(7)+hand_binary
    act_exp3_0_det_state_use_detected_xy: false
    # true: 检测失败直接抛错；false: 回退 ee_pose x,y
    act_exp3_0_det_detector_strict_on_failure: false

    # ---- 尺度自适应三档闭合（仅执行期；需首次检测成功锁存 bbox+深度+内参估计的 size_score）----
    # false: 与原版一致，仅用二值 grasp 硬件模板
    act_exp3_0_det_scale_closure_enabled: true
    # 用小/中/大三类代表包裹各采若干帧 size_score，取相邻档中点；以下为占位默认值，请按实测替换
    act_exp3_0_det_scale_small_threshold_m: 0.25
    act_exp3_0_det_scale_large_threshold_m: 0.35
    # max: size_score = max(width_m,height_m)；sqrt_area: sqrt(width_m*height_m)
    act_exp3_0_det_scale_score_mode: sqrt
    # 测试：每次 RT-DETR 成功推理打印位置/尺度/档位；每次尺度闭合 grasp 再打印一行
    act_exp3_0_det_scale_test_log: true

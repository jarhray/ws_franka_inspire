# 与 ws_record_data/datasets/exp3_0/meta/info.json 对齐：
# - observation.state: 8 = [ee_pose(7), hand_grasp_binary_0]
# - action:            8 = [ee_pose(7), hand_grasp_binary_0]
# - 三路 RGB/Depth: cam1/cam3/cam4
policy_manager:
  ros__parameters:
    policy_type: act_exp3_0
    act_exp3_0_control_hz: 8.0

    act_exp3_0_checkpoint_dir: "/home/jhr/exp3_0/checkpoints/last/pretrained_model"
    # act_exp3_0_checkpoint_dir: "/data/wangyuxuan/models/exp3/act_exp3_0/120000/pretrained_model"
    act_exp3_0_device: auto

    act_exp3_0_image_keys:
      - observation.images.cam1_color
      - observation.images.cam3_color
      - observation.images.cam4_color
    act_exp3_0_depth_keys:
      - observation.cam1_depth
      - observation.cam3_depth
      - observation.cam4_depth
    act_exp3_0_camera_ids: [cam1, cam3, cam4]
    act_exp3_0_depth_camera_ids: [cam1, cam3, cam4]
    act_exp3_0_use_depth: true

    act_exp3_0_state_key: observation.state
    act_exp3_0_img_h: 480
    act_exp3_0_img_w: 640
    act_exp3_0_depth_clip_mm_min: 100.0
    act_exp3_0_depth_clip_mm_max: 8000.0
    act_exp3_0_state_dim: 8
    act_exp3_0_action_dim: 8

    arm_reference_frame: fr3_link0
    arm_duration_sec: 0.2
    hand_duration_sec: 0.1
    act_exp3_0_hand_finger_id_order: [0, 1, 2, 3, 4, 5]
    act_exp3_0_hand_binary_threshold: 0.5
    act_exp3_0_hand_binary_reset_hardware: [1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 0.0]
    act_exp3_0_hand_binary_grasp_hardware: [500.0, 500.0, 500.0, 500.0, 500.0, 0.0]
